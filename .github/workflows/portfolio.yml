name: Portfolio

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    name: Verify portfolio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
      - run: npm run bootstrap
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: notes
        with:
          repository: angadsinghsandhu/Notes
          ref: 5b040f280bbad62df1e1a9172a0f2ca067afc504
          path: site/.generated/notes-checkout
          persist-credentials: false
      - run: npm ci
        working-directory: site/.generated/notes-checkout/site
      - name: Verify combined Portfolio and Notes
        env:
          NOTES_REVISION: ${{ steps.notes.outputs.commit }}
          PORTFOLIO_ORIGIN: https://portfolio-preview.example
          PORTFOLIO_NOTES_BROWSER: archive
        run: |
          staging="$(mktemp -d "$RUNNER_TEMP/portfolio-notes.XXXXXX")"
          (
            cd .generated/notes-checkout/site
            ./node_modules/.bin/tsx scripts/export-portfolio.ts --out "$staging/export" --revision "$NOTES_REVISION" > "$staging/receipt.json"
          )
          npm run import:notes -- --from "$staging/export" --receipt "$staging/receipt.json" --revision "$NOTES_REVISION"
          npm run build:release
          npm run verify:output -- --dir dist
          npm run test:browser
